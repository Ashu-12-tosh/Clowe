# www.cloweshop.com → https://cloweshop.com, in one 301 hop, over http or https.
#
# Mounted as conf.d/00-www-redirect.conf (docker-compose.prod.yml) so it loads
# before default.conf (nginx.conf). The server's own nginx.conf also lists
# www.cloweshop.com; nginx keeps this first definition and logs "conflicting
# server name ... ignored" for the other, which is harmless. Removing
# www.cloweshop.com from the server_name lines there silences it.
#
# The site is served only from the bare domain: the API's CORS allows that
# origin alone, so pages loaded from www could not reach it.

server {
    listen 80;
    server_name www.cloweshop.com;

    # Certificate renewal still answers here: the certificate covers www.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cloweshop.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.cloweshop.com;

    ssl_certificate     /etc/letsencrypt/live/cloweshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloweshop.com/privkey.pem;

    return 301 https://cloweshop.com$request_uri;
}
