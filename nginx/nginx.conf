# Clowe — Nginx reverse proxy (cloweshop.com; certificates from certbot, see DEPLOYMENT.md)
#
# The app containers are found by name on every request, through Docker's own
# DNS (127.0.0.11), never once at start: a rebuilt api or web container can
# come back on a different address, and nginx must follow it without a
# restart. A variable in proxy_pass is what makes nginx resolve at request
# time; with no URI part, the request's own URI is passed on unchanged.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare: once the site is behind it, every connection comes from one of
# Cloudflare's addresses, and the visitor's own address is in CF-Connecting-IP.
# For a connection from these ranges only, nginx takes the client address from
# that header, so $remote_addr (and with it X-Real-IP, X-Forwarded-For, the
# API's rate limits and the access log) is the visitor again. From anywhere
# else the header is ignored and nothing changes - so it is safe before the
# switch, and nobody can fake an address by sending the header themselves.
# Ranges from https://www.cloudflare.com/ips/ (checked 17 Oct 2026).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name cloweshop.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS.
    location / { return 301 https://$host$request_uri; }

    client_max_body_size 12m;

    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }
}

server {
    listen 443 ssl http2;
    server_name cloweshop.com;

    ssl_certificate     /etc/letsencrypt/live/cloweshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloweshop.com/privkey.pem;

    client_max_body_size 12m;

    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
