# Clowe — Nginx reverse proxy (cloweshop.com; certificates from certbot, see DEPLOYMENT.md)
#
# The app containers are found by name on every request, through Docker's own
# DNS (127.0.0.11), never once at start: a rebuilt api or web container can
# come back on a different address, and nginx must follow it without a
# restart. A variable in proxy_pass is what makes nginx resolve at request
# time; with no URI part, the request's own URI is passed on unchanged.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name cloweshop.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS.
    location / { return 301 https://$host$request_uri; }

    client_max_body_size 12m;

    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }
}

server {
    listen 443 ssl http2;
    server_name cloweshop.com;

    ssl_certificate     /etc/letsencrypt/live/cloweshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloweshop.com/privkey.pem;

    client_max_body_size 12m;

    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
