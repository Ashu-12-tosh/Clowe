services:
  db:
    image: postgres:16-alpine
    container_name: clowe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clowe
      POSTGRES_PASSWORD: clowe_dev_password
      POSTGRES_DB: clowe
    ports:
      # Host port 5433 to avoid clashing with other local Postgres instances
      - "5433:5432"
    volumes:
      - clowe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clowe -d clowe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clowe_pgdata:
